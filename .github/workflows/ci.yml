name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-test:
    name: Build & test (Windows)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # net8.0 targeting pack + a newer SDK that understands the .slnx solution format.
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore RDPeek.slnx

      - name: Build
        run: dotnet build RDPeek.slnx -c Release --no-restore

      - name: Test
        run: dotnet test RDPeek.slnx -c Release --no-build --verbosity normal

  mock-integration:
    name: Plugin ↔ mock (headless DVC checkpoint)
    runs-on: windows-latest
    needs: build-test
    # The checkpoint has hung to the 6h default (the headless mstscax host / a blocked cmdlet). A parent
    # watchdog (below) caps it at 5min and dumps the process tree; this is only a last-resort backstop.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # .NET diagnostics tools so the checkpoint can dump the bootstrap if it hangs (see below).
      - name: Install .NET diagnostics tools
        shell: pwsh
        run: |
          dotnet tool install -g dotnet-dump
          dotnet tool install -g dotnet-stack
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Append

      # Runs the checkpoint (build shim/plugin/bootstrap, start the mock, trust its cert, load the
      # plugin via the shim over a real DVC, assert the diag handshake) under a PARENT watchdog: if the
      # child doesn't exit in 5 min it's hung, so we dump the whole process tree — managed stacks
      # (dotnet-stack) + full minidumps (comsvcs MiniDump, works on native + managed) + the logs — into
      # hang-artifacts/, then kill it and fail. The dumps pinpoint exactly which call is blocked.
      - name: Headless plugin checkpoint against the mock (watchdogged)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = 'hang-artifacts'
          $child = Start-Process pwsh -PassThru -NoNewWindow -ArgumentList @(
            '-NoProfile','-File','./tools/mock-plugin-checkpoint.ps1',
            '-MockSource','download','-HoldSeconds','15')
          if ($child.WaitForExit(300000)) { exit $child.ExitCode }

          Write-Warning "checkpoint (pid $($child.Id)) did not exit in 5min — capturing the process tree."
          New-Item -ItemType Directory -Force $dir | Out-Null
          $suspects = Get-Process -ErrorAction SilentlyContinue |
            Where-Object { $_.ProcessName -in 'pwsh','MockRdp','MockRdpCli','rdpeek-bootstrap','rdpeek-plugin','dotnet' -and $_.Id -ne $PID }
          foreach ($p in $suspects) {
            $tag = "$($p.ProcessName)-$($p.Id)"
            Write-Host "dumping $tag"
            try { & dotnet-stack report -p $p.Id *> (Join-Path $dir "stack-$tag.txt") } catch { "dotnet-stack failed: $_" | Out-File (Join-Path $dir "stack-$tag.txt") }
            # comsvcs MiniDump needs an absolute path and no-space args; works on native + managed.
            $dmp = Join-Path (Resolve-Path $dir).Path "dump-$tag.dmp"
            try { & rundll32.exe C:\Windows\System32\comsvcs.dll, MiniDump $p.Id $dmp full 2>$null } catch {}
          }
          try { Copy-Item "$env:TEMP\rdpeek-*.log" $dir -Force -ErrorAction SilentlyContinue } catch {}
          try { Stop-Process -Id $child.Id -Force -ErrorAction SilentlyContinue } catch {}
          Get-ChildItem $dir -ErrorAction SilentlyContinue | Format-Table Name,Length -AutoSize | Out-String | Write-Host
          throw "checkpoint hung >5min; dumps + stacks captured in $dir (uploaded as the mock-hang-dump artifact)."

      - name: Upload hang diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mock-hang-dump
          path: hang-artifacts/
          if-no-files-found: ignore

  publish:
    name: Publish tools (win-x64)
    runs-on: windows-latest
    needs: build-test
    if: github.event_name != 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Publish rdpeek-doctor
        run: >
          dotnet publish src/Rdpeek.Doctor -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish/doctor

      - name: Publish rdpeek-agent
        run: >
          dotnet publish src/Rdpeek.Agent -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish/agent

      - name: Publish rdpeek-agent-service
        run: >
          dotnet publish src/Rdpeek.AgentService -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish/agentservice

      # The installer + its native shim (rdpeek-vc-shim.dll, built by the Bootstrap's MSBuild
      # target). windows-latest has the VS C++ tools the shim needs. The shim stays a loose DLL
      # beside the exe (the RDP control loads it by path), so it is not bundled into the single file.
      - name: Publish rdpeek-bootstrap (+ vc-shim)
        run: >
          dotnet publish src/Rdpeek.Bootstrap -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish/bootstrap

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rdpeek-tools-win-x64
          path: |
            publish/doctor/rdpeek-doctor.exe
            publish/agent/rdpeek-agent.exe
            publish/agentservice/rdpeek-agent-service.exe
            publish/bootstrap/rdpeek-bootstrap.exe
            publish/bootstrap/rdpeek-vc-shim.dll
          if-no-files-found: error
