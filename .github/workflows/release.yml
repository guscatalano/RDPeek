name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build + publish release assets
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Publish self-contained agent + doctor
        run: |
          dotnet publish src/Rdpeek.Agent  -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish/agent
          dotnet publish src/Rdpeek.Doctor -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish/doctor

      # The installer + its native shim (rdpeek-vc-shim.dll, built by the Bootstrap's MSBuild target).
      # The shim must stay a loose DLL next to the exe, so the two ship together as a zip.
      - name: Publish installer + shim
        run: dotnet publish src/Rdpeek.Bootstrap -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish/bootstrap

      - name: Bundle installer (exe + shim) as a zip
        shell: pwsh
        run: Compress-Archive -Path publish/bootstrap/rdpeek-bootstrap.exe, publish/bootstrap/rdpeek-vc-shim.dll -DestinationPath publish/rdpeek-bootstrap-win-x64.zip -Force

      - name: Create / update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ github.event.inputs.tag }}' } else { '${{ github.ref_name }}' }
          gh release create $tag `
            publish/agent/rdpeek-agent.exe `
            publish/doctor/rdpeek-doctor.exe `
            publish/rdpeek-bootstrap-win-x64.zip `
            --title $tag --generate-notes
