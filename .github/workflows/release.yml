name: Release

# CI-driven release: pushing a v* tag (or running this manually) builds every artifact and publishes
# a GitHub Release. Produces the Companion as a standalone EXE, an MSI and an MSIX, plus the agent,
# doctor and bootstrap tools.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build + publish release assets
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Derive version
        id: ver
        shell: pwsh
        run: |
          $tag = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ github.event.inputs.tag }}' } else { '${{ github.ref_name }}' }
          $v = $tag -replace '^v',''
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "ver=$v"   >> $env:GITHUB_OUTPUT
          "msix=$v.0" >> $env:GITHUB_OUTPUT

      # ── Companion: standalone single-file EXE ───────────────────────────
      - name: Publish Companion (standalone exe)
        run: >
          dotnet publish src/Rdpeek.Companion.WinUI -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none -p:DebugSymbols=false -p:Version=${{ steps.ver.outputs.ver }}
          -o publish/companion
      - name: Name the standalone exe
        shell: pwsh
        run: Copy-Item publish/companion/Rdpeek.Companion.WinUI.exe publish/rdpeek-companion.exe

      # Stage the client plugins into their OWN folder (not publish/companion): the MSI installs them into
      # a per-version subfolder and registers them, so an upgrade never overwrites a plugin mstsc still has
      # loaded. The standalone exe and MSIX stay companion-only.
      - name: Stage client plugins for the MSI
        shell: pwsh
        run: |
          dotnet publish src/Rdpeek.Plugin -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none -p:Version=${{ steps.ver.outputs.ver }} -o publish/pluginpub
          & "$env:GITHUB_WORKSPACE\src\Rdpeek.WindowPlugin\build.cmd"
          New-Item -ItemType Directory publish/plugins -Force | Out-Null
          Copy-Item publish/pluginpub/rdpeek-plugin.exe publish/plugins/
          Copy-Item src/Rdpeek.WindowPlugin/bin/rdpeek-window-plugin.dll publish/plugins/

      # ── Companion: MSI (WiX) ────────────────────────────────────────────
      - name: Install WiX
        shell: pwsh
        run: |
          # Pin to v5 — WiX v7 gates behind the Open Source Maintenance Fee EULA (WIX7015).
          dotnet tool install --global wix --version 5.0.2
          "$env:USERPROFILE\.dotnet\tools" >> $env:GITHUB_PATH
      - name: Build MSI
        shell: pwsh
        run: |
          $pub = (Resolve-Path publish/companion).Path      # companion files (bindpath 'pub')
          $pl  = (Resolve-Path publish/plugins).Path        # versioned plugin payload (bindpath 'plugins')
          wix build packaging/companion/Package.wxs -b pub="$pub" -b plugins="$pl" -d Version=${{ steps.ver.outputs.ver }} -o publish/rdpeek-companion.msi
          $size = (Get-Item publish/rdpeek-companion.msi).Length
          "MSI size: $size"
          if ($size -lt 5MB) { throw "MSI is $size bytes — payload missing (bindpath glob matched nothing)" }

      # ── Companion: MSIX (MakeAppx + self-signed cert) ───────────────────
      - name: Build + sign MSIX
        shell: pwsh
        run: |
          $ver = '${{ steps.ver.outputs.msix }}'
          $layout = 'publish/msix-layout'
          New-Item -ItemType Directory "$layout/Assets" -Force | Out-Null
          Copy-Item publish/companion/Rdpeek.Companion.WinUI.exe $layout
          Copy-Item packaging/companion/msix/Assets/* "$layout/Assets/"
          (Get-Content packaging/companion/msix/AppxManifest.xml -Raw).Replace('$VERSION$', $ver) | Set-Content "$layout/AppxManifest.xml" -Encoding UTF8
          $ma = (Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\makeappx.exe' | Sort-Object FullName | Select-Object -Last 1).FullName
          $st = (Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' | Sort-Object FullName | Select-Object -Last 1).FullName
          & $ma pack /d $layout /p publish/rdpeek-companion.msix /o
          if ($LASTEXITCODE -ne 0) { throw "makeappx failed" }
          # Self-signed cert whose subject matches the manifest Publisher (CN=Gus Catalano). Exported as
          # .cer so users can trust it to install the MSIX (an unsigned/untrusted MSIX won't install).
          $cert = New-SelfSignedCertificate -Type Custom -Subject 'CN=Gus Catalano' -KeyUsage DigitalSignature `
            -CertStoreLocation 'Cert:\CurrentUser\My' -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3','2.5.29.19={text}')
          $pw = ConvertTo-SecureString 'rdpeek' -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath cert.pfx -Password $pw | Out-Null
          Export-Certificate -Cert $cert -FilePath publish/rdpeek-companion-msix.cer | Out-Null
          & $st sign /fd SHA256 /f cert.pfx /p 'rdpeek' publish/rdpeek-companion.msix
          if ($LASTEXITCODE -ne 0) { throw "signtool failed" }
          Remove-Item "Cert:\CurrentUser\My\$($cert.Thumbprint)" -ErrorAction SilentlyContinue

      # ── agent / service / doctor / bootstrap ────────────────────────────
      - name: Publish agent + service + doctor
        run: |
          dotnet publish src/Rdpeek.Agent        -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:Version=${{ steps.ver.outputs.ver }} -o publish/agent
          dotnet publish src/Rdpeek.AgentService -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:Version=${{ steps.ver.outputs.ver }} -o publish/agentservice
          dotnet publish src/Rdpeek.Doctor       -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:Version=${{ steps.ver.outputs.ver }} -o publish/doctor
      # One download for the server side: the agent, the optional supervisor service, and the install
      # scripts co-located (the service resolves the agent next to its own exe, so install just works).
      - name: Bundle server install (agent + service + scripts)
        shell: pwsh
        run: |
          $b = 'publish/agent-server'
          New-Item -ItemType Directory -Force $b | Out-Null
          Copy-Item publish/agent/rdpeek-agent.exe                 $b
          Copy-Item publish/agentservice/rdpeek-agent-service.exe  $b
          Copy-Item tools/install-agent-service.ps1                $b
          Copy-Item tools/uninstall-agent-service.ps1              $b
          Compress-Archive -Path "$b/*" -DestinationPath publish/rdpeek-agent-server-win-x64.zip -Force
      - name: Publish bootstrap (+ vc-shim)
        run: dotnet publish src/Rdpeek.Bootstrap -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish/bootstrap
      - name: Bundle bootstrap (exe + shim) as a zip
        shell: pwsh
        run: Compress-Archive -Path publish/bootstrap/rdpeek-bootstrap.exe, publish/bootstrap/rdpeek-vc-shim.dll -DestinationPath publish/rdpeek-bootstrap-win-x64.zip -Force

      - name: Create / update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = '${{ steps.ver.outputs.tag }}'
          $assets = @(
            'publish/rdpeek-companion.exe',
            'publish/rdpeek-companion.msi',
            'publish/rdpeek-companion.msix',
            'publish/rdpeek-companion-msix.cer',
            'publish/agent/rdpeek-agent.exe',
            'publish/agentservice/rdpeek-agent-service.exe',
            'publish/rdpeek-agent-server-win-x64.zip',
            'publish/doctor/rdpeek-doctor.exe',
            'publish/rdpeek-bootstrap-win-x64.zip'
          )
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            # Release exists (e.g. a re-run) — overwrite its assets.
            gh release upload $tag @assets --clobber
          } else {
            gh release create $tag @assets --title $tag --generate-notes
          }
